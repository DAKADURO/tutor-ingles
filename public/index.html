<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tutor de Inglés</title>
<meta name="theme-color" content="#0f1115" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="style.css" />
<script>
  (function () {
    try {
      if (localStorage.getItem('tutorIngles.theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {
      /* localStorage no disponible */
    }
  })();
</script>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-top">
        <div>
          <h1>🇬🇧 Tutor de Inglés</h1>
          <p class="subtitle">Practica conversación en inglés</p>
        </div>
        <div class="header-actions">
          <button id="themeToggleBtn" class="theme-toggle-btn" title="Cambiar tema">🌙</button>
          <div id="streakBadge" class="streak-badge" title="Racha de días practicando">🔥 0</div>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="homeTab">🏠 Hoy</button>
        <button class="tab-btn" data-tab="chatTab">💬 Chat</button>
        <button class="tab-btn" data-tab="cardsTab">📇 Vocabulario</button>
        <button class="tab-btn" data-tab="grammarTab">📘 Gramática</button>
        <button class="tab-btn" data-tab="listeningTab">🎧 Escucha</button>
        <button class="tab-btn" data-tab="writingTab">✍️ Escritura</button>
        <button class="tab-btn" data-tab="interviewTab">💼 Entrevista</button>
        <button class="tab-btn" data-tab="mistakesTab">❌ Errores</button>
        <button class="tab-btn" data-tab="progressTab">📊 Progreso</button>
      </nav>
    </header>
    <div id="milestoneToast" class="milestone-toast"></div>

    <section id="homeTab" class="tab-panel active">
      <div class="home-greeting" id="homeGreeting"></div>
      <div class="home-plan" id="homePlan"></div>
    </section>

    <section id="chatTab" class="tab-panel">
      <div class="chat-toolbar">
        <label class="level-label">
          Nivel:
          <select id="levelSelect">
            <option value="A1">A1 (Principiante)</option>
            <option value="A2" selected>A2 (Básico)</option>
            <option value="B1">B1 (Intermedio)</option>
            <option value="B2">B2 (Intermedio alto)</option>
            <option value="C1">C1 (Avanzado)</option>
            <option value="C2">C2 (Dominio)</option>
          </select>
        </label>
        <button id="clearBtn" class="clear-btn" title="Borrar conversación">🗑️ Limpiar</button>
      </div>

      <div id="chat" class="chat"></div>

      <div class="input-row">
        <button id="micBtn" class="mic-btn" title="Hablar">🎤</button>
        <input id="textInput" type="text" placeholder="Escribe o presiona el micrófono para hablar en inglés..." autocomplete="off" />
        <button id="sendBtn" class="send-btn">Enviar</button>
      </div>

      <div class="controls">
        <label><input type="checkbox" id="autoSpeak" checked /> Leer respuestas en voz alta</label>
        <button id="replayBtn" class="clear-btn" title="Repetir la última respuesta">🔊 Repetir</button>
        <span id="status" class="status"></span>
      </div>
    </section>

    <section id="cardsTab" class="tab-panel">
      <div class="cards-header">
        <label class="level-label">
          Tema:
          <select id="topicSelect"></select>
        </label>
        <button id="resetCardsBtn" class="clear-btn" title="Reiniciar progreso">🔄 Reiniciar progreso</button>
      </div>
      <div id="cardsRemaining" class="cards-remaining"></div>
      <div id="cardArea" class="card-area"></div>
    </section>

    <section id="grammarTab" class="tab-panel">
      <div id="grammarList" class="grammar-list"></div>
      <div id="grammarDetail" class="grammar-detail" style="display:none;"></div>
    </section>

    <section id="listeningTab" class="tab-panel">
      <div class="mode-toggle listening-mode-toggle">
        <button class="listening-mode-btn active" data-mode="sentences">🗣️ Frases</button>
        <button class="listening-mode-btn" data-mode="dialogues">💬 Diálogos</button>
      </div>
      <div id="listeningArea" class="listening-area"></div>
    </section>

    <section id="writingTab" class="tab-panel">
      <div class="writing-toolbar">
        <span id="writingPrompt" class="writing-prompt"></span>
        <button id="newWritingPromptBtn" class="clear-btn" title="Nuevo tema">🔀 Nuevo tema</button>
      </div>
      <textarea id="writingInput" class="writing-textarea" placeholder="Escribe aquí en inglés (2-5 frases)..."></textarea>
      <div class="controls">
        <button id="submitWritingBtn" class="send-btn">✅ Revisar mi texto</button>
        <span id="writingStatus" class="status"></span>
      </div>
      <div id="writingFeedback" class="writing-feedback"></div>
    </section>

    <section id="interviewTab" class="tab-panel">
      <div id="interviewSetup" class="interview-setup">
        <label class="level-label">
          Puesto de trabajo:
          <select id="roleSelect">
            <option value="Customer Service Representative">Atención al cliente</option>
            <option value="Waiter/Waitress">Mesero/a</option>
            <option value="Software Developer">Desarrollador de software</option>
            <option value="Sales Associate">Ventas</option>
            <option value="Administrative Assistant">Asistente administrativo</option>
            <option value="custom">Otro (especificar)...</option>
          </select>
        </label>
        <input id="customRoleInput" type="text" placeholder="Escribe el puesto en inglés..." class="custom-role-input" style="display:none;" />
        <button id="startInterviewBtn" class="send-btn">🎬 Iniciar entrevista</button>
      </div>

      <div id="interviewChat" class="chat"></div>

      <div id="interviewInputRow" class="input-row" style="display:none;">
        <button id="interviewMicBtn" class="mic-btn" title="Hablar">🎤</button>
        <input id="interviewTextInput" type="text" placeholder="Responde en inglés..." autocomplete="off" />
        <button id="interviewSendBtn" class="send-btn">Enviar</button>
      </div>

      <div id="interviewControls" class="controls" style="display:none;">
        <button id="finishInterviewBtn" class="clear-btn">🏁 Finalizar y ver feedback</button>
        <span id="interviewStatus" class="status"></span>
      </div>
    </section>

    <section id="mistakesTab" class="tab-panel">
      <div class="cards-header">
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="review">📇 Repasar</button>
          <button class="mode-btn" data-mode="list">🗂️ Lista</button>
        </div>
        <button id="clearMistakesBtn" class="clear-btn" title="Borrar todos los errores">🗑️ Borrar todo</button>
      </div>
      <div id="mistakesCount" class="cards-remaining"></div>
      <div id="mistakesReviewArea" class="card-area"></div>
      <div id="mistakesList" class="mistakes-list"></div>
    </section>

    <section id="progressTab" class="tab-panel">
      <div class="progress-goal" id="progressGoal"></div>
      <div class="stats-grid" id="statsGrid"></div>

      <h2 class="section-title">🗓️ Calendario de racha (últimos 84 días)</h2>
      <div id="streakCalendar" class="streak-calendar"></div>

      <h2 class="section-title">🏆 Logros</h2>
      <div id="achievementsGrid" class="achievements-grid"></div>

      <h2 class="section-title">🔔 Recordatorios</h2>
      <div class="reminder-settings">
        <button id="enableRemindersBtn" class="clear-btn">🔔 Activar recordatorios</button>
        <span id="reminderStatus" class="status"></span>
      </div>

      <h2 class="section-title">💾 Respaldo de tus datos</h2>
      <div class="backup-actions">
        <button id="exportBackupBtn" class="clear-btn">⬇️ Exportar respaldo</button>
        <button id="importBackupBtn" class="clear-btn">⬆️ Importar respaldo</button>
        <input id="importBackupFile" type="file" accept="application/json" style="display:none;" />
      </div>
      <p class="backup-hint">Tu progreso vive solo en este navegador. Exporta un archivo de vez en cuando por si cambias de celular o borras el caché.</p>

      <h2 class="section-title">🔐 Sesión</h2>
      <div class="backup-actions">
        <button id="logoutBtn" class="clear-btn">🔒 Cerrar sesión</button>
      </div>
    </section>
  </div>

  <script src="vocab.js"></script>
  <script src="grammar.js"></script>
  <script src="listening.js"></script>
  <script src="writing.js"></script>
  <script src="achievements.js"></script>
  <script src="app.js"></script>
</body>
</html>
